<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>SPECACT mark</title>
  <defs>
    <mask id="keyhole" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="29.5" r="4.3" fill="#000"/>
      <rect x="29.8" y="30.5" width="4.4" height="11" rx="2.2" fill="#000"/>
    </mask>
  </defs>
  <!-- the circle of people who may see it -->
  <circle cx="32" cy="32" r="27" stroke="#14594A" stroke-width="2.4" opacity=".4"/>
  <!-- the moment, with a keyhole: yours -->
  <circle cx="32" cy="32" r="15.5" fill="#14594A" mask="url(#keyhole)"/>
  <!-- the few you chose -->
  <circle cx="51.1" cy="12.9" r="4.2" fill="#EE7F43"/>
  <circle cx="27.3" cy="58.6" r="3.4" fill="#EE7F43"/>
  <circle cx="6.6" cy="22.8" r="3.4" fill="#EE7F43"/>
</svg>
