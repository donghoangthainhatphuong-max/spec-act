# docker compose up -d --build   →   http://localhost:${SPECACT_PORT:-8088}
# Edit .env and run `docker compose up -d` again to change any setting (no rebuild needed,
# except VITE_BASE_PATH).
name: spec-act

services:
  specact:
    image: spec-act:latest
    build:
      context: .
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    container_name: spec-act
    env_file: .env
    ports:
      - "${SPECACT_PORT:-8088}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional: link previews (Open Graph cards for pasted links). Start with `docker compose --profile preview up -d`
  # and set VITE_LINK_PREVIEW_URL=/link-preview?url={url} in .env. It fetches pages on YOUR server; see docker/link-preview/server.mjs.
  link-preview:
    profiles: [preview]
    image: node:22-alpine
    container_name: spec-act-link-preview
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./docker/link-preview/server.mjs:/app/server.mjs:ro
    expose:
      - "8787"
    user: node
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
