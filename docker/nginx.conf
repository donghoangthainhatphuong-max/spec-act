# Static hosting only — SPECACT has no backend. After the page and scripts are served,
# the browser talks to Google directly and never to this server again.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Security headers (CSP restricts connect-src to Google: tokens and files only travel browser <-> Google)
    # live in security-headers.conf and are included by every location below.

    # --- caching -----------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # runtime configuration generated from the container's VITE_* variables at start-up
    location = /env-config.js {
        alias /tmp/specact/env-config.js;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # entry points must always be revalidated so updates are picked up
    location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
